name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Set extension version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
              version.split('.').some(part => Number(part) > 65535) || version === '0.0.0') {
            throw new Error('Tag must be vX.Y.Z or X.Y.Z, with components 0–65535 and a nonzero version.');
          }
          for (const path of ['package.json', 'chrome-extension/package.json']) {
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            pkg.version = version;
            writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE

      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build extension ZIP
        run: pnpm zip

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          mv dist-zip/*.zip "release-assets/sealos-deploy-chrome-extension-${RELEASE_TAG}.zip"
          unzip -t release-assets/*.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
